name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
    env:
      CHAN_QUANT_DATA_SOURCE: synthetic
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.11.17
      - name: Verify lock file
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q

  frontend:
    name: Frontend / Node.js 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Type-check and build
        run: npm run build

  deployment:
    name: Deployment / offline container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - backend
      - frontend
    env:
      CHAN_QUANT_BASIC_AUTH_USER: ci-private-user
      CHAN_QUANT_RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Generate ephemeral smoke credentials
        run: |
          password="$(openssl rand -hex 24)"
          hash="$(docker run --rm caddy:2.10-alpine caddy hash-password --plaintext "${password}")"
          echo "::add-mask::${password}"
          echo "CHAN_QUANT_BASIC_AUTH_PASSWORD=${password}" >> "${GITHUB_ENV}"
          echo "CHAN_QUANT_BASIC_AUTH_HASH=${hash}" >> "${GITHUB_ENV}"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production images
        run: docker compose build
      - name: Start offline staging
        run: docker compose up -d --wait
      - name: Verify runtime hardening
        run: |
          test "$(docker compose exec -T api id -u)" != "0"
          test "$(docker compose exec -T web id -u)" != "0"
          docker compose exec -T web test ! -d /srv/node_modules
          if docker compose port api 8000 >/dev/null 2>&1; then
            echo "api port must not be published" >&2
            exit 1
          fi
          test "$(docker compose port web 8080)" = "127.0.0.1:8080"
      - name: Run authenticated smoke checks
        run: ./deploy/smoke-test.sh
      - name: Verify restart recovery
        run: |
          docker compose restart
          docker compose up -d --wait
          ./deploy/smoke-test.sh
      - name: Verify clean down and up recovery
        run: |
          docker compose down
          docker compose up -d --wait
          ./deploy/smoke-test.sh
      - name: Check container logs for sensitive request material
        run: |
          logs="$(docker compose logs)"
          if printf '%s' "${logs}" | grep -E 'Authorization:|Basic [A-Za-z0-9+/=]+|/Users/|CHAN_QUANT_BASIC_AUTH_PASSWORD'; then
            echo "container logs contain sensitive request material or a host path" >&2
            exit 1
          fi
      - name: Stop staging
        if: always()
        run: docker compose down --volumes --remove-orphans
