[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chan-quant-backend"
version = "0.1.0"
description = "Auditable Chan-theory quantitative research backend"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.16.3,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chan_quant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
